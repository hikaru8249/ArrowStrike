<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0d0f1a"/>
  <!-- Bow arc -->
  <path d="M 180 120 Q 100 256 180 392" stroke="#8B6914" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Bowstring -->
  <line x1="180" y1="120" x2="260" y2="256" stroke="#ddd" stroke-width="4"/>
  <line x1="260" y1="256" x2="180" y2="392" stroke="#ddd" stroke-width="4"/>
  <!-- Arrow shaft -->
  <line x1="100" y1="256" x2="340" y2="256" stroke="#c8a060" stroke-width="8" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="340,256 310,240 310,272" fill="#aaa"/>
  <!-- Arrow fletching -->
  <polygon points="120,256 100,240 108,256" fill="#c04040"/>
  <polygon points="120,256 100,272 108,256" fill="#c04040"/>
  <!-- Stars -->
  <circle cx="380" cy="140" r="6" fill="#FAC775" opacity="0.9"/>
  <circle cx="420" cy="100" r="4" fill="#FAC775" opacity="0.7"/>
  <circle cx="400" cy="170" r="3" fill="#FAC775" opacity="0.5"/>
</svg>
